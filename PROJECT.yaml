    budget_increase: true
  skills:
    discovery: true
    automatic_selection: true
    load_on_demand: true
    missing_skill_policy: Report and use equivalent procedure
  agents:
    enabled: true
    delegation: Intelligent
    model: inherit
    independent_review: true
  testing:
    automated: true
    manual_checklists: true
    regression: true
    security: true
    combinatorial: Risk Based
  documentation:
    enabled: true
    architecture_decisions: true
    persistent_progress: true
  communication:
    technical_level: Software Engineer
    infrastructure_level: Beginner Friendly
    explain_decisions: true
    explain_commands: true
    report_limitations: true
